<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project — Nacca Design</title>

    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/project.css">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.min.css" rel="stylesheet">

</head>

<body class="project-body">


    <!-- HEADER -->

    <header class="project-header">

        <a href="index.html" class="project-header__logo">

            <img src="media/logo_nacca.svg" alt="Nacca Design Logo">

        </a>


        <button class="project-back link">

            <i class="ri-arrow-left-line"></i>

            <span>BACK TO PROJECTS</span>

        </button>

    </header>



    <!-- PAGE -->

    <main class="project-page">


        <!-- SIDEBAR -->

        <aside class="project-sidebar">

            <a href="#context" class="nav-context">
                <span class="sidebar-number"></span>
                <p>CONTEXT</p>
            </a>

            <a href="#strategy" class="nav-strategy">
                <span class="sidebar-number"></span>
                <p>STRATEGY</p>
            </a>

            <a href="#identity" class="nav-identity">
                <span class="sidebar-number"></span>
                <p>IDENTITY</p>
            </a>

            <a href="#applications" class="nav-applications">
                <span class="sidebar-number"></span>
                <p>APPLICATIONS</p>
            </a>

            <a href="#video-grid" class="nav-video-grid">
                <span class="sidebar-number"></span>
                <p>MOTION</p>
            </a>

            <a href="#digital" class="nav-digital">
                <span class="sidebar-number"></span>
                <p>DIGITAL</p>
            </a>

            <a href="#communication" class="nav-communication">
                <span class="sidebar-number"></span>
                <p>MEDIA</p>
            </a>

            <a href="#downloads" class="nav-downloads">
                <span class="sidebar-number"></span>
                <p>RESOURCES</p>
            </a>

        </aside>



        <!-- CONTENT -->

        <div class="project-content">


            <!-- HERO -->

            <section class="project-hero">


                <!-- LEFT -->

                <div class="project-hero__info">

                    <span class="project-category text--xl"></span>


                    <div class="project-title">

                        <img class="project-logo" alt="Project Logo">

                    </div>


                    <h2 class="project-subtitle"></h2>


                    <span class="project-year"></span>


                    <p class="project-description"></p>



                    <div class="project-meta">

                        <div>

                            <span class="meta-title text--md">
                                SERVICES
                            </span>

                            <p class="project-services"></p>

                        </div>



                        <div>

                            <span class="meta-title text--md">
                                AREA
                            </span>

                            <p class="project-area"></p>

                        </div>

                    </div>

                </div>



                <!-- RIGHT -->

                <div class="project-hero__image">

                    <img class="project-hero-image" alt="Project Hero">

                </div>

            </section>



            <!-- CONTEXT -->

            <section class="project-section" id="context">

                <div class="project-section__intro">

                    <div>

                        <span class="project-section__number text--md">
                        </span>

                        <h2 class="project-section__title context-title"></h2>

                    </div>

                    <p class="project-section__text context-text"></p>

                </div>



                <div class="project-section__content project-info-grid">

                </div>

            </section>





            <!-- STRATEGY -->

            <section class="project-section strategy-section" id="strategy">

                <!-- IMAGE -->

                <div class="strategy-image-wrapper">

                    <img class="strategy-image">

                </div>


                <!-- CONTENT -->

                <div class="strategy-content-wrapper">

                    <div>

                        <span class="project-section__number text--md">
                        </span>

                        <h2 class="project-section__title strategy-title"></h2>
                    </div>

                    <p class="strategy-intro"></p>

                    <div class="strategy-values"></div>

                </div>

            </section>


            <!-- IDENTITY -->

            <section class="project-section" id="identity">

                <div class="project-section__intro">

                    <div>

                        <span class="project-section__number text--md">
                        </span>

                        <h2 class="project-section__title identity-title"></h2>

                    </div>

                    <p class="project-section__text identity-text"></p>

                </div>



                <div class="identity-layout">

                    <!-- LEFT BLOCK -->

                    <div class="identity-brand">

                        <img class="identity-logo" alt="Identity Logo">

                        <div class="identity-colors">

                        </div>

                    </div>


                    <!-- RIGHT BLOCK -->

                    <div class="identity-pattern-wrapper">

                        <img class="identity-pattern" alt="Pattern">

                    </div>

                </div>

            </section>

            <!-- APPLICATIONS -->

            <section class="project-section" id="applications">

                <div class="applications-header">

                    <span class="project-section__number text--md">
                        /04
                    </span>

                    <h2 class="project-section__title applications-title"></h2>

                </div>

                <div class="applications-grid"></div>

            </section>

            <!-- VIDEO GRID -->

            <section id="video-grid" class="project-section">

                <div class="project-section__intro">

                    <div>

                        <span class="project-section__number text--md">
                        </span>

                        <h2 class="project-section__title video-grid-title">
                        </h2>

                    </div>

                    <p class="project-section__text video-grid-text">
                    </p>

                </div>


                <div class="video-grid">
                </div>

            </section>

            <!-- DIGITAL -->

            <section class="project-section" id="digital">

                <div class="project-section__intro">

                    <div>

                        <span class="project-section__number text--md">
                        </span>

                        <h2 class="project-section__title digital-title"></h2>

                    </div>

                    <p class="project-section__text digital-text"></p>

                </div>



                <div class="digital-layout">

                    <img class="digital-desktop" alt="Desktop">

                </div>

            </section>

            <!-- COMMUNICATION -->

            <section class="project-section" id="communication">

                <div class="project-section__intro">

                    <div>

                        <span class="project-section__number text--md">
                        </span>

                        <h2 class="project-section__title communication-title"></h2>

                    </div>

                    <p class="project-section__text communication-text"></p>

                </div>


                <div class="communication-grid">
                </div>

            </section>

            <!-- DOWNLOADS -->

            <section class="project-section downloads-section" id="downloads">

                <div class="project-section__intro">

                    <div>

                        <span class="project-section__number text--md">
                        </span>

                        <h2 class="project-section__title downloads-title"></h2>

                    </div>

                    <p class="project-section__text downloads-text"></p>

                </div>

                <div class="downloads-list"></div>

            </section>

        </div>

    </main>



    <!-- SCROLL TOP -->

    <button class="scroll-top btn btn--trans">

        <i class="ri-arrow-up-line"></i>

    </button>


    <!-- FOOTER -->

    <footer>

        <div class="footer__wrap flex-column">

            <div class="footer__top flex-row">

                <svg xmlns="http://www.w3.org/2000/svg" width="50px" height="50px">

                    <use class="logo-light" href="media/imagotipo_nacca.svg#imago-logo"></use>

                </svg>


                <div class="footer__rrss flex-row">

                    <a href="https://www.behance.net/naccadesign" target="_blank">

                        <i class="ri-behance-line"></i>

                    </a>

                    <a href="https://www.linkedin.com/in/sernacca/" target="_blank">

                        <i class="ri-linkedin-line"></i>

                    </a>

                </div>

            </div>

        </div>

    </footer>



    <!-- PROJECT SCRIPT -->

    <script src="js/project.js"></script>

    <!-- IMAGE LIGHTBOX -->

    <div class="lightbox hidden">

        <button class="lightbox-close">

            <i class="ri-close-line"></i>

        </button>

        <img class="lightbox-image" src="" alt="">

    </div>

</body>

</html>
